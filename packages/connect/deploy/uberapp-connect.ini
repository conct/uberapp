; supervisord service definition for the Uberapp handoff broker.
;
; Install to ~/etc/services.d/uberapp-connect.ini, then:
;   supervisorctl reread && supervisorctl update
;
; Nothing secret belongs here, and nothing is: the broker has no token, no
; database and no credentials. It holds sealed payloads in memory for about two
; minutes each and cannot read any of them. Restarting it loses at most a
; pairing that was already in progress, which the browser retries by showing a
; new code.

; command= is rewritten by install.sh to node's absolute path. supervisord
; spawns without a login shell, so it does not inherit the PATH that puts the
; account's chosen Node version in reach — and a bare `node` here fails with
; nothing but "ERROR (spawn error)", with the reason nowhere near it.
[program:uberapp-connect]
command=node %(ENV_HOME)s/uberapp/packages/connect/dist/index.js
directory=%(ENV_HOME)s/uberapp
autostart=yes
autorestart=yes
; Uberspace's supervisord treats a process that dies sooner than this as a
; failed start rather than a crash loop. Ten seconds is the floor the
; service wizard enforces (MIN_STARTSECS), and it is plenty here: both
; processes bind their port immediately, so a start that survives ten
; seconds has survived everything that goes wrong at startup.
;
; The cost of a larger value is not theoretical. Every install and every
; self-update restarts both services, and `supervisorctl restart` waits
; out startsecs before it returns - at 30 that was a minute of waiting per
; update, for nothing.
startsecs=10
startretries=3
; NODE_ENV is deliberately absent. Nothing in the agent reads it, and its
; only effect was to break the self-update: supervisord passes this
; environment to the process, the process passes it to npm, and npm then
; skips devDependencies - where typescript and @types/ws live - so the
; build failed on a package that was right there. A variable no code
; consults is not a setting, it is a trap.
environment=PORT="8400"
stdout_logfile=%(ENV_HOME)s/logs/uberapp-connect.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
