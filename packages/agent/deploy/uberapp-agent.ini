; supervisord service definition for the Uberapp agent.
;
; Install to ~/etc/services.d/uberapp-agent.ini, then:
;   supervisorctl reread && supervisorctl update
;
; The token is deliberately NOT set here. Service .ini files are easy to read
; back and end up in backups; the agent reads the token from
; ~/.config/uberapp/token instead, which install.sh creates with mode 600.

; command= is rewritten by install.sh to node's absolute path. supervisord
; spawns without a login shell, so it does not inherit the PATH that puts the
; account's chosen Node version in reach — and a bare `node` here fails with
; nothing but "ERROR (spawn error)", with the reason nowhere near it.
[program:uberapp-agent]
command=node %(ENV_HOME)s/uberapp/packages/agent/dist/index.js
directory=%(ENV_HOME)s/uberapp
autostart=yes
autorestart=yes
; Uberspace's supervisord treats a process that dies sooner than this as a
; failed start rather than a crash loop. Ten seconds is the floor the
; service wizard enforces (MIN_STARTSECS), and it is plenty here: both
; processes bind their port immediately, so a start that survives ten
; seconds has survived everything that goes wrong at startup.
;
; The cost of a larger value is not theoretical. Every install and every
; self-update restarts both services, and `supervisorctl restart` waits
; out startsecs before it returns - at 30 that was a minute of waiting per
; update, for nothing.
startsecs=10
startretries=3
; PATH is filled in by install.sh with the one a login shell has. Without
; it the agent inherits supervisord's, which need not contain the account's
; Node - and then every tool the agent starts (npm, git) is missing for the
; same reason the service itself would not start.
environment=UBERAPP_PORT="8399",UBERAPP_BIND="0.0.0.0",NODE_ENV="production",PATH="AGENT_PATH"
stdout_logfile=%(ENV_HOME)s/logs/uberapp-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
