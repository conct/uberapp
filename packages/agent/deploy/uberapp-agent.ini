; supervisord service definition for the Uberapp agent.
;
; Install to ~/etc/services.d/uberapp-agent.ini, then:
;   supervisorctl reread && supervisorctl update
;
; The token is deliberately NOT set here. Service .ini files are easy to read
; back and end up in backups; the agent reads the token from
; ~/.config/uberapp/token instead, which install.sh creates with mode 600.

[program:uberapp-agent]
command=node %(ENV_HOME)s/uberapp/packages/agent/dist/index.js
directory=%(ENV_HOME)s/uberapp
autostart=yes
autorestart=yes
; Uberspace's supervisord treats a process that dies sooner than this as a
; failed start rather than a crash loop.
startsecs=30
startretries=3
environment=UBERAPP_PORT="8399",UBERAPP_BIND="0.0.0.0",NODE_ENV="production"
stdout_logfile=%(ENV_HOME)s/logs/uberapp-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
